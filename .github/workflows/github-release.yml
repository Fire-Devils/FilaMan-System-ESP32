name: GitHub Release

on:
  workflow_call:
    secrets:
      RELEASE_TOKEN:
        description: 'GitHub token for release creation'
        required: true

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
    
    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade platformio esptool
    
    - name: Install xxd
      run: |
        sudo apt-get update
        sudo apt-get install xxd
    
    - name: Build Firmware
      run: |
        VERSION=$(grep '^version = ' platformio.ini | cut -d'"' -f2)

        # Beide Envs bauen (Web-Oberflaeche ist in der Firmware eingebettet, kein LittleFS-Image)
        pio run -e esp32dev -e esp32-s3-devkitc-1

        # boot_app0.bin aus dem PlatformIO-Framework-Paket (Pfad robust ermitteln)
        BOOT_APP0=$(find "${PLATFORMIO_CORE_DIR:-$HOME/.platformio}/packages" -path '*framework-arduinoespressif32*/tools/partitions/boot_app0.bin' | head -n1)
        if [ -z "$BOOT_APP0" ]; then echo "Error: boot_app0.bin not found"; exit 1; fi
        echo "boot_app0.bin: $BOOT_APP0"

        OUT=.pio/release
        mkdir -p "$OUT"

        # Upgrade-Dateien: Upload fuer den FilaMan-Server UND fuer die alte Upgrade-Seite.
        # Dateinamen duerfen NIE "website" enthalten (alte Geraete behandeln das als LittleFS-Image).
        cp .pio/build/esp32dev/firmware.bin "$OUT/upgrade_filaman_firmware_v${VERSION}.bin"
        cp .pio/build/esp32-s3-devkitc-1/firmware.bin "$OUT/upgrade_filaman_firmware_esp32s3_v${VERSION}.bin"

        # Initial-Images (Kabel / Web-Installer) fuer leere oder alte Geraete
        (cd .pio/build/esp32dev &&
        esptool.py --chip esp32 merge_bin \
          --fill-flash-size 4MB \
          --flash_mode dio \
          --flash_freq 40m \
          --flash_size 4MB \
          -o "$GITHUB_WORKSPACE/$OUT/filaman_full_${VERSION}.bin" \
          0x1000 bootloader.bin \
          0x8000 partitions.bin \
          0xe000 "$BOOT_APP0" \
          0x10000 firmware.bin)

        (cd .pio/build/esp32-s3-devkitc-1 &&
        esptool.py --chip esp32s3 merge_bin \
          --fill-flash-size 8MB \
          --flash_mode dio \
          --flash_freq 80m \
          --flash_size 8MB \
          -o "$GITHUB_WORKSPACE/$OUT/filaman_full_esp32s3_${VERSION}.bin" \
          0x0 bootloader.bin \
          0x8000 partitions.bin \
          0xe000 "$BOOT_APP0" \
          0x10000 firmware.bin)

        # Verify file sizes
        echo "File sizes:"
        ls -lh "$OUT"
    
    - name: Get version from platformio.ini
      id: get_version
      run: |
        VERSION=$(grep '^version = ' platformio.ini | cut -d'"' -f2)
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
      
    - name: Generate Release Notes
      id: release_notes
      run: |
        # Get the latest tag
        LATEST_TAG=$(git for-each-ref --sort=-creatordate --format '%(refname:short)' refs/tags | sed -n '2p')
        
        if [ -n "$LATEST_TAG" ]; then
          echo "CHANGES<<EOF" >> $GITHUB_OUTPUT
          echo "Changes since ${LATEST_TAG}:" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          
          # Get all commits since last release with commit hash and author
          echo "### Added" >> $GITHUB_OUTPUT
          git log ${LATEST_TAG}..HEAD --pretty=format:"%h - %s (%an)" | grep -iE '^[a-f0-9]+ - (feat|add|new)' | sed 's/^[a-f0-9]* - feat: /- /' >> $GITHUB_OUTPUT || true
          echo "" >> $GITHUB_OUTPUT
          
          echo "### Fixed" >> $GITHUB_OUTPUT
          git log ${LATEST_TAG}..HEAD --pretty=format:"%h - %s (%an)" | grep -iE '^[a-f0-9]+ - fix' | sed 's/^[a-f0-9]* - fix: /- /' >> $GITHUB_OUTPUT || true
          echo "" >> $GITHUB_OUTPUT
          
          echo "### Changed" >> $GITHUB_OUTPUT
          git log ${LATEST_TAG}..HEAD --pretty=format:"%h - %s (%an)" | grep -ivE '^[a-f0-9]+ - (feat|fix|add|new)' | sed 's/^[a-f0-9]* - /- /' >> $GITHUB_OUTPUT || true
          echo "EOF" >> $GITHUB_OUTPUT
        else
          # First release
          echo "CHANGES<<EOF" >> $GITHUB_OUTPUT
          echo "Initial Release" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          
          # Add all commits for initial release
          echo "### Added" >> $GITHUB_OUTPUT
          git log --pretty=format:"%h - %s (%an)" | grep -iE '^[a-f0-9]+ - (feat|add|new)' | sed 's/^[a-f0-9]* - feat: /- /' >> $GITHUB_OUTPUT || true
          echo "" >> $GITHUB_OUTPUT
          
          echo "### Fixed" >> $GITHUB_OUTPUT
          git log --pretty=format:"%h - %s (%an)" | grep -iE '^[a-f0-9]+ - fix' | sed 's/^[a-f0-9]* - fix: /- /' >> $GITHUB_OUTPUT || true
          echo "" >> $GITHUB_OUTPUT
          
          echo "### Changed" >> $GITHUB_OUTPUT
          git log --pretty=format:"%h - %s (%an)" | grep -ivE '^[a-f0-9]+ - (feat|fix|add|new)' | sed 's/^[a-f0-9]* - /- /' >> $GITHUB_OUTPUT || true
          echo "EOF" >> $GITHUB_OUTPUT
        fi

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        RELEASE_NOTES: ${{ steps.release_notes.outputs.CHANGES }}
      run: |
        VERSION=${{ steps.get_version.outputs.VERSION }}
        cd .pio/release
        
        # Create release with available files
        FILES_TO_UPLOAD=""
        for file in upgrade_filaman_firmware_v${VERSION}.bin upgrade_filaman_firmware_esp32s3_v${VERSION}.bin filaman_full_${VERSION}.bin filaman_full_esp32s3_${VERSION}.bin; do
          if [ -f "$file" ]; then
            FILES_TO_UPLOAD="$FILES_TO_UPLOAD $file"
          fi
        done

        # Create release with available files
        if [ -n "$FILES_TO_UPLOAD" ]; then
          gh release create "v${VERSION}" \
            --title "Release ${VERSION}" \
            --notes "$RELEASE_NOTES" \
            $FILES_TO_UPLOAD
        else
          echo "Error: No files found to upload"
          exit 1
        fi
