; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[common]
version = "3.4.10"
to_old_version = "3.4.0"

[env:esp32dev]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
board_upload.flash_size = 4MB
board_build.flash_mode = dio
board_upload.flash_freq = "40m"
extra_scripts = scripts/extra_script.py

[platformio]
default_envs = 
	esp32dev
	esp32-s3-devkitc-1

[env]
build_flags = 
	-Os
	-ffunction-sections
	-fdata-sections
	-mtext-section-literals
	-DVERSION=\"${common.version}\"
	-DTOOLDVERSION=\"${common.to_old_version}\"
	-DASYNCWEBSERVER_REGEX
	-DCONFIG_ARDUHAL_LOG_COLORS=1
	-DBOOT_APP_PARTITION_OTA_0=1
	-DCONFIG_ASYNC_TCP_RUNNING_CORE=1
	-DCONFIG_ASYNC_TCP_MAX_ACK_TIME=10000
	-DCONFIG_ASYNC_TCP_QUEUE_SIZE=128
	-DCONFIG_ASYNC_TCP_STACK_SIZE=8192
	-DCONFIG_ASYNC_TCP_PRIORITY=10
	# WDT für AsyncTCP deaktiviert: Mit aktivem WDT konnten langsame
	# WebSocket-Sender (z. B. große ws.textAll-JSONs) den AsyncTCP-Task
	# killen und so alle Clients abwerfen.
	-DCONFIG_ASYNC_TCP_USE_WDT=0
lib_deps = 
	tzapu/WiFiManager @ ^2.0.17
	https://github.com/me-no-dev/ESPAsyncWebServer.git#ad3741d159f9cfd50c567e81b67f3bef1dc6d89f
	https://github.com/esphome/AsyncTCP.git#acdd7cd680ef442abded748a4b8d117eb6f22eb2
	bogde/HX711 @ ^0.7.5
	adafruit/Adafruit SSD1306 @ ^2.5.13
	adafruit/Adafruit GFX Library @ ^1.11.11
	adafruit/Adafruit PN532 @ ^1.3.3
	bblanchon/ArduinoJson @ ^7.3.0
monitor_speed = 115200

[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts = scripts/extra_script.py
upload_protocol = esptool
board_build.flash_mode = dio
platform = espressif32@6.10.0
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
board_upload.flash_size = 8MB
