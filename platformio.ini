; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[common]
version = "3.3.2"
to_old_version = "3.2.0"

[env:esp32-wroom]
platform = espressif32@^6.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = 
	tzapu/WiFiManager @ ^2.0.17
	https://github.com/me-no-dev/ESPAsyncWebServer.git#master
	https://github.com/esphome/AsyncTCP.git
	bogde/HX711 @ ^0.7.5
	adafruit/Adafruit SSD1306 @ ^2.5.13
	adafruit/Adafruit GFX Library @ ^1.11.11
	adafruit/Adafruit PN532 @ ^1.3.3
	bblanchon/ArduinoJson @ ^7.3.0
	knolleary/PubSubClient @ ^2.8
	digitaldragon/SSLClient @ ^1.3.2
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
board_upload.flash_size = 4MB
board_build.flash_mode = dio
board_upload.flash_freq = "40m"
build_flags = 
	-Iinclude
	-Os
	-ffunction-sections
	-fdata-sections
	-mtext-section-literals
    -DVERSION_TOKEN=${common.version}
    -DTOOLDVERSION_TOKEN=${common.to_old_version}
	-DASYNCWEBSERVER_REGEX
	-DCONFIG_ARDUHAL_LOG_COLORS=1
	-DCONFIG_OPTIMIZATION_LEVEL_DEBUG=1
	-DBOOT_APP_PARTITION_OTA_0=1
	; undefined to prevent warnings about redefinition of this values.
	-UCONFIG_ASYNC_TCP_RUNNING_CORE
	-DCONFIG_ASYNC_TCP_RUNNING_CORE=1
	-UDCONFIG_ASYNC_TCP_MAX_ACK_TIME
	-DCONFIG_ASYNC_TCP_MAX_ACK_TIME=10000
	-DCONFIG_ASYNC_TCP_QUEUE_SIZE=128
	-UDCONFIG_ASYNC_TCP_STACK_SIZE
	-DCONFIG_ASYNC_TCP_STACK_SIZE=8192
	-UCONFIG_ASYNC_TCP_USE_WDT
	-DCONFIG_ASYNC_TCP_USE_WDT=0
	-UCONFIG_LWIP_TCP_MSL
	-DCONFIG_LWIP_TCP_MSL=30000
	-UCONFIG_LWIP_TCP_RCV_BUF_DEFAULT
	-DCONFIG_LWIP_TCP_RCV_BUF_DEFAULT=8192
	; Removed as the default value is 16 and we're just overriding it to the same value.
	; -UCONFIG_LWIP_MAX_ACTIVE_TCP
	; -DCONFIG_LWIP_MAX_ACTIVE_TCP=16
	-DESP32_DEV=1
extra_scripts = scripts/extra_script.py

[env:olimex-esp32-poe]
extends = env:esp32-wroom
board = esp32-poe
build_flags = 
	${env:esp32-wroom.build_flags}
	-UESP32_DEV
	-DOLIMEX_ESP32_POE=1
    -DHAS_ETHERNET=1

[env:olimex-esp32-poe-wrover]
extends = env:esp32-wroom
board = esp32-poe
build_flags = 
    ${env:esp32-wroom.build_flags}
    -UESP32_DEV
    -DOLIMEX_ESP32_POE=1
    -DHAS_ETHERNET=1
    -DBOARD_HAS_PSRAM=1